# Проверки Ayris. Смысл этого файла: вся приёмка кода происходит здесь, а не
# руками на машине разработчика. Ayris — Windows-приложение, поэтому тесты
# гоняются на windows-раннерах; линтеры и mypy — на ubuntu, там они быстрее,
# а mypy всё равно зафиксирован на platform = "win32" в pyproject.toml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Понедельник 06:17 UTC — раз в неделю проверить живость сетевых адресов
    # (маркер network) в чистой среде. На push/PR эти тесты исключены, чтобы
    # падение чужого сайта не красило PR; job test-network идёт только здесь.
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  # Тесты не должны открывать настоящих окон ни на одном раннере.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt

      - name: Установить зависимости
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -e . --no-deps

      - name: ruff
        run: ruff check --output-format=github src tests

      - name: black
        run: black --check --diff src tests

      - name: mypy
        run: mypy src

      - name: Секретов в коде нет
        # Единственное место, где это проверяется автоматически. Шаблон
        # намеренно разорван конкатенацией: без разрыва `git grep` находит сам
        # этот файл и джоб краснеет на собственном тексте. Проверка стоит в
        # линтерах, а не в тестах: она нужна один раз на прогон и требует git,
        # которого у песочницы с распакованным архивом может не быть.
        # Паттерн синхронен со scripts/check.sh. Ветки без завязки на длину
        # (sk-ant-/sk-proj-/AKIA/AIza/xox, gho_/ghu_/ghs_/ghr_) ловят ключи
        # Anthropic, OpenAI-project, AWS, Google, Slack — их дефис рвёт серию
        # {20} у старого sk-, а проект тянет и anthropic, и openai.
        run: |
          PAT='githu''b_pat_[A-Za-z0-9_]{20,}|gh[oprsu]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20}|sk-ant-[A-Za-z0-9-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|BEGIN( [A-Z0-9]+)? PRIVATE KEY'
          FOUND=$(git grep -nIE "$PAT" || true)
          FILES=$(git ls-files | grep -iE '(^|/)(\.env(\.|$)|.*credentials?.*\.(json|ya?ml|toml)|id_(rsa|dsa|ecdsa|ed25519)|.*\.(pem|pfx|p12|key))' || true)
          if [ -n "$FOUND" ] || [ -n "$FILES" ]; then
            echo "::error::похоже на секрет в коде"
            [ -n "$FOUND" ] && echo "$FOUND"
            [ -n "$FILES" ] && echo "секрет-файл в индексе:" && echo "$FILES"
            exit 1
          fi
          echo "секретов не найдено"

  test-windows:
    name: Тесты Windows / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt

      - name: Установить зависимости
        # Второй вызов — пакеты, из которых нужен только бинарник; почему без
        # зависимостей, написано в самом requirements-ci-nodeps.txt.
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -e . --no-deps

      - name: pytest
        # hardware — тесты, которым нужен настоящий микрофон, динамики или
        # монитор; на раннере их нет, они остаются для ручного прогона.
        # models — тесты на скачанных весах; для них есть джоб test-models.
        # network — ходят к чужим серверам; там же, где веса, чтобы падение
        # чужого сайта не красило четыре джоба сразу.
        # slow — единственные тесты, которые утверждают что-то про время. Они
        # идут отдельным последовательным вызовом ниже: под -n они делят ядро с
        # семью другими процессами, и «уложился в N мс» становится броском
        # монеты. Шесть секунд за то, чтобы красный цвет всегда что-то значил.
        #
        # -n auto: тесты ждут не процессор, а порождённые процессы и таймеры,
        # поэтому четыре воркера дают не 4x, а больше — 293 с превращаются в
        # ~90. --dist=loadgroup раскладывает по тестам так же, как load, но
        # тесты с маркером `xdist_group` держит на одном воркере: буфер обмена
        # один на весь рабочий стол, и тесты настоящего буфера на двух воркерах
        # сразу отбирают его друг у друга. Если падение похоже на гонку,
        # источник истины — джоб «Тесты Linux серийно» (test-linux-serial): он
        # намеренно последовательный и идёт по расписанию/вручную.
        #
        # --cov только на py3.12: покрытие удваивает прогон, а отчёт с двух
        # версий питона один и тот же. Порог (fail_under) — в pyproject.toml.
        run: >
          pytest -m "not hardware and not models and not network and not slow"
          -n auto --dist=loadgroup
          ${{ matrix.python == '3.12' && '--cov --cov-report=xml --cov-report=term-missing' || '' }}
          --junitxml=junit/pytest-${{ matrix.python }}.xml

      - name: pytest про время, последовательно
        run: >
          pytest -m "slow"
          --junitxml=junit/pytest-slow-${{ matrix.python }}.xml

      - name: Приложение отвечает на --version
        # --version — argparse action=version, выходит в parse_args ДО ленивых
        # импортов Qt/GUI. Ловит только жадную цепочку импортов __main__.
        run: python -m ayris --version

      - name: Ленивый слой импортируется
        # То, что --version не грузит: GUI, воркеры, пайплайн, триггеры, таймеры.
        # Сломанный импорт во вкладке или воркере иначе виден только pytest-у.
        # QApplication не создаётся, окон нет (QT_QPA_PLATFORM=offscreen).
        run: python -c "import ayris.gui.main_window, ayris.core.pipeline_app, ayris.workers, ayris.triggers, ayris.actions.timers"

      - name: Выгрузить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-py${{ matrix.python }}
          path: |
            junit/
            coverage.xml
          if-no-files-found: ignore

  test-linux:
    name: Тесты Linux / py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt

      - name: Системные библиотеки для Qt
        # Без них не импортируется даже PySide6.QtCore в headless-режиме.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxrender1

      - name: Установить зависимости
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -e . --no-deps

      - name: pytest
        # На Linux часть подсистем недоступна принципиально (WinAPI, реестр,
        # Credential Manager). Такие тесты сами скипаются по sys.platform.
        # Прогон здесь нужен, чтобы совпадать с тем, что проверяется в песочнице.
        #
        # -n auto --dist=loadgroup — как на windows-джобах. Серийный прогон на
        # ubuntu доходил до 2.5 часов и был самым долгим звеном всего CI, держа
        # обратную связь на PR. Параллельный укладывается в десятки минут. Тесты
        # про время (slow) идут отдельным серийным шагом ниже: под -n «уложился в
        # N мс» стал бы броском монеты. Полный серийный прогон как эталон для
        # диагностики гонок сохранён джобом test-linux-serial — по расписанию и
        # вручную, вне критического пути PR.
        run: >
          pytest -m "not hardware and not models and not network and not slow"
          -n auto --dist=loadgroup

      - name: pytest про время, последовательно
        run: pytest -m "slow"

  test-linux-serial:
    name: Тесты Linux серийно / эталон гонок
    runs-on: ubuntu-latest
    # Полный прогон БЕЗ -n — эталон для диагностики гонок. Раньше это делал
    # основной linux-джоб, но серийные ~2.5 часа были самым долгим звеном CI и
    # держали обратную связь на каждом PR. Теперь на push/PR linux идёт
    # параллельно, а серийный эталон запускается только по расписанию и вручную
    # (как test-network): для PR он ничего не решает, но всегда под рукой, когда
    # падение похоже на гонку, а не на баг.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt

      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxrender1

      - name: Установить зависимости
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -e . --no-deps

      - name: pytest серийно
        # Намеренно без -n и без `not slow`: единый последовательный прогон,
        # в котором гонки и тесты про время воспроизводятся детерминированно.
        run: pytest -m "not hardware and not models and not network"

  test-models:
    name: Тесты на настоящих весах / Windows
    runs-on: windows-latest
    # Восемь тестов, которые проверяют то, чего заглушка проверить не может:
    # что Vosk распознаёт фикстуру, что Piper выдаёт звук нужной длины, что
    # openWakeWord загружается. Пока они не шли нигде, кроме машины
    # разработчика, в путях к моделям спокойно жили пять багов — и все пять
    # всплыли в тот день, когда веса наконец скачали. Отдельный джоб, а не
    # matrix: веса нужны один раз, а не на каждую версию python.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt
            requirements-ci-models.txt

      - name: Установить зависимости
        # -c: без файла ограничений pip поднимает numpy выше пина проекта, чтобы
        # угодить scipy из зависимостей openwakeword. Подробнее — в комментарии
        # внутри requirements-ci-models.txt.
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -c requirements-ci.txt -r requirements-ci-models.txt
          python -m pip install -e . --no-deps

      - name: Кэш весов
        # Ключ — по самим файлам каталога: поменялся адрес или sha256, значит
        # кэш недействителен. Иначе — ни одного байта из сети, и джоб идёт
        # столько же, сколько обычный.
        uses: actions/cache@v4
        with:
          path: .models-cache
          key: models-${{ hashFiles('resources/models/*.json') }}-whisper-tiny

      - name: Скачать веса
        # Через собственный каталог проекта, а не curl: так проверяется и сама
        # машинерия — адреса живы, sha256 совпадают, архив распаковывается,
        # файлы ложатся под именами, которые потом ищут движки. Последнее и было
        # сломано у openWakeWord.
        run: python scripts/fetch_models.py

      - name: pytest
        run: pytest -m "models"

      - name: Окружение то, что заявлено
        # Не `pip check`: этот джоб намеренно ставит и ayris, и pyrnnoise с
        # --no-deps, а pip check считает ошибкой каждую отсутствующую
        # транзитивную зависимость — двенадцать намеренных строк, в которых
        # тонет единственная важная. Важна она вот какая: openwakeword тянет
        # scipy, тот требует numpy>=2.3, и pip молча поднимает numpy поверх
        # пина 1.26.4, против ABI которого собраны vosk и faster-whisper.
        # Скрипт сверяет установленное с пинами из requirements-ci*.txt, то
        # есть проверяет ровно работу флага -c выше.
        run: python scripts/verify_pins.py

  test-network:
    name: Живость сетевых адресов / Windows
    runs-on: windows-latest
    # Тесты с маркером network ходят к чужим серверам (HEAD по адресам моделей).
    # В обычных джобах они исключены, чтобы падение чужого сайта не красило PR.
    # Здесь идут отдельно и ТОЛЬКО по расписанию/вручную: link rot в адресе
    # модели всплывёт до пользователя, а не у него на первом запуске. На push и
    # pull_request job не запускается — условие ниже отсекает эти события.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-ci-nodeps.txt

      - name: Установить зависимости
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -r requirements-ci-nodeps.txt
          python -m pip install -e . --no-deps

      - name: pytest network
        run: pytest -m "network"
