<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayris — Neural Sphere (embed)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #cdbce8; }
  /* Прозрачный по умолчанию: свечение тает в ноль по краям, а фон-градиент
     варианта виден за сферой. Вариант может задать сплошной фон через #bg=. */
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="scene"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

  // --- параметры из #hash: a=низ b=верх e=кромка bg=фон(hex|transparent) -------
  //     mode=calm|listening|thinking|speaking|error  bloom=  points=  op=
  const P = new URLSearchParams(location.hash.slice(1));
  const hex = (k, d) => { const v = P.get(k); return v ? ('#' + v.replace(/^#/, '')) : d; };
  const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };
  const COL_A = hex('a', '#5236a6');
  const COL_B = hex('b', '#52a8f0');
  const COL_E = hex('e', '#b7ccf2');
  const BG = P.get('bg');                         // null | 'transparent' | 'rrggbb'
  const START_MODE = P.get('mode') || 'calm';

  const container = document.getElementById('scene');
  // Размер вьюпорта с защитой от нуля: при инициализации во вложенном/ленивом
  // iframe (галерея) layout может быть ещё не готов и innerWidth/Height == 0 —
  // тогда рендер-таргеты композера получают нулевой размер (incomplete framebuffer).
  const VW = () => Math.max(1, container.clientWidth || window.innerWidth || 1);
  const VH = () => Math.max(1, container.clientHeight || window.innerHeight || 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, VW() / VH(), 0.1, 100);

  // Камера подбирается так, чтобы сфера целиком влезала при любом соотношении.
  const FIT_R = 2.15;
  function fitCamera() {
    const aspect = VW() / VH();
    const vFov = (camera.fov * Math.PI) / 180;
    const distV = FIT_R / Math.sin(vFov / 2);
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
    const distH = FIT_R / Math.sin(hFov / 2);
    camera.position.set(0, 0, Math.max(distV, distH));
  }
  fitCamera();

  // preserveDrawingBuffer: замороженный в галерее кадр не должен пропадать при
  // перекомпоновке слоя (скролл) — без него остановленный canvas чернеет.
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(VW(), VH());
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  const group = new THREE.Group();
  group.rotation.z = -0.12;
  group.rotation.x = 0.14;
  scene.add(group);

  // --- геометрия: сетка меридианов + параллелей (LineSegments) ----------------
  const R = 1.6;
  let LAT = 46, LON = 60;
  const SEG = 3;
  function buildGrid() {
    const positions = [];
    const Pt = (lat, lon) => {
      const cx = Math.cos(lat);
      return new THREE.Vector3(R * cx * Math.cos(lon), R * Math.sin(lat), R * cx * Math.sin(lon));
    };
    const pushSeg = (a, b) => { positions.push(a.x, a.y, a.z, b.x, b.y, b.z); };
    const lerp = (a, b, t) => a.clone().lerp(b, t);
    for (let i = 1; i < LAT; i++) {
      const lat = -Math.PI / 2 + (Math.PI * i) / LAT;
      for (let j = 0; j < LON; j++) {
        const a = Pt(lat, (2 * Math.PI * j) / LON), b = Pt(lat, (2 * Math.PI * (j + 1)) / LON);
        for (let s = 0; s < SEG; s++) pushSeg(lerp(a, b, s / SEG), lerp(a, b, (s + 1) / SEG));
      }
    }
    for (let j = 0; j < LON; j++) {
      const lon = (2 * Math.PI * j) / LON;
      for (let i = 0; i < LAT; i++) {
        const a = Pt(-Math.PI / 2 + (Math.PI * i) / LAT, lon), b = Pt(-Math.PI / 2 + (Math.PI * (i + 1)) / LAT, lon);
        for (let s = 0; s < SEG; s++) pushSeg(lerp(a, b, s / SEG), lerp(a, b, (s + 1) / SEG));
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return geo;
  }
  const uniforms = {
    uTime: { value: 0 }, uAmp: { value: 0.06 }, uFreq: { value: 1.7 }, uSpeed: { value: 0.18 },
    uWaveAmp: { value: 0.05 }, uWaveFreq: { value: 2.2 }, uTwist: { value: 0.0 }, uJitter: { value: 0.0 },
    uBreath: { value: 0.0 },
    uColorA: { value: new THREE.Color(COL_A) },
    uColorB: { value: new THREE.Color(COL_B) },
    uColorEdge: { value: new THREE.Color(COL_E) },
    uOpacity: { value: num('op', 1.0) }, uCamPos: { value: new THREE.Vector3() },
    uFill: { value: num('fill', 0.0) },
  };

  const vertexShader = /* glsl */`
    uniform float uTime, uAmp, uFreq, uSpeed, uWaveAmp, uWaveFreq, uTwist, uJitter, uBreath;
    varying float vShade; varying vec3 vWorld; varying vec3 vNormal;
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+1.0*C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
      i=mod(i,289.0);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z);
      vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }
    void main() {
      vec3 pos = position; vec3 n = normalize(pos); float lat = n.y;
      float ang = uTwist * lat; float cs = cos(ang), sn = sin(ang);
      pos = vec3(pos.x*cs - pos.z*sn, pos.y, pos.x*sn + pos.z*cs);
      n = vec3(n.x*cs - n.z*sn, n.y, n.x*sn + n.z*cs);
      float t = uTime * uSpeed;
      float noise = snoise(n * uFreq + vec3(0.0, t, 0.0));
      noise += 0.25 * snoise(n * uFreq * 2.0 + vec3(t * 1.3, 0.0, 0.0));
      float wave = sin(lat * uWaveFreq - uTime * 1.6);
      float bottom = smoothstep(0.2, -0.75, lat);
      float disp = uAmp * noise + uWaveAmp * wave * (0.5 + 0.5 * bottom);
      disp += uJitter * snoise(n * 9.0 + uTime * 9.0) * 0.6;
      float poleFade = 1.0 - pow(abs(lat), 3.0);
      disp *= 0.4 + 0.6 * poleFade;
      float scale = 1.0 + uBreath;
      pos += n * disp * R_CONST * scale; pos *= scale;
      vShade = clamp(lat * 0.5 + 0.5, 0.0, 1.0);
      vNormal = normalize(normalMatrix * n);
      vec4 wp = modelMatrix * vec4(pos, 1.0); vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `.replace(/R_CONST/g, R.toFixed(3));

  const fragmentShader = /* glsl */`
    precision highp float;
    uniform vec3 uColorA, uColorB, uColorEdge, uCamPos; uniform float uOpacity;
    varying float vShade; varying vec3 vWorld; varying vec3 vNormal;
    void main() {
      // Пол яркости у низа/нутра: без него нижние линии уходят в тёмный uColorA,
      // получают низкую альфу в alphaPass и «просвечивают»/мутнеют на фоне варианта.
      float shade = clamp(0.42 + 0.58 * vShade, 0.0, 1.0);
      vec3 base = mix(uColorA, uColorB, shade);
      vec3 V = normalize(uCamPos - vWorld);
      float fres = pow(1.0 - abs(dot(normalize(vNormal), V)), 2.2);
      vec3 col = mix(base, uColorEdge, fres * 0.55);
      col += fres * 0.18 + 0.05;   // + лёгкий ambient, чтобы нутро не было тусклым
      float alpha = uOpacity * (0.6 + 0.4 * fres);
      gl_FragColor = vec4(col, alpha);
    }
  `;

  const material = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const sphere = new THREE.LineSegments(buildGrid(), material);
  group.add(sphere);

  // --- сплошное «тело» сферы: тонированная мембрана, плотная по центру и тающая
  //     к кромке. Без неё каркас прозрачен и фон варианта (например солнце
  //     синтвейва) виден насквозь. Мембрана депозитит яркость по силуэту →
  //     alphaPass превращает её в непрозрачность и вуалирует подложку, а кромка
  //     остаётся стеклянной (facing→0). Геометрия и вершинный шейдер — те же, что
  //     у каркаса, поэтому мембрана деформируется с ним синхронно.
  const fillFragment = /* glsl */`
    precision highp float;
    uniform vec3 uColorA, uColorB, uCamPos; uniform float uFill;
    varying float vShade; varying vec3 vWorld; varying vec3 vNormal;
    void main() {
      vec3 V = normalize(uCamPos - vWorld);
      float fres = pow(1.0 - abs(dot(normalize(vNormal), V)), 2.2);
      float facing = 1.0 - fres;                 // 1 в центре силуэта, 0 на кромке
      float shade = clamp(0.42 + 0.58 * vShade, 0.0, 1.0);
      vec3 tint = mix(uColorA, uColorB, shade);
      float amt = uFill * pow(facing, 1.0);
      gl_FragColor = vec4(tint * amt, 1.0);
    }
  `;
  const fillMat = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader: fillFragment,
    transparent: true, blending: THREE.AdditiveBlending,
    depthTest: false, depthWrite: false, side: THREE.FrontSide,
  });
  const fill = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), fillMat);
  fill.renderOrder = 0; sphere.renderOrder = 1;
  group.add(fill);

  const composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  renderPass.clearAlpha = 0;
  composer.addPass(renderPass);
  const bloom = new UnrealBloomPass(new THREE.Vector2(VW(), VH()), 0.55, 0.6, 0.22);
  composer.addPass(bloom);
  // Bloom/композер отдаёт непрозрачный чёрный фон (альфа теряется в проходах).
  // Финальный проход возвращает прозрачность: чёрное → alpha 0, свечение сферы
  // держит альфу по своей яркости. Так подложка варианта видна сквозь сферу без
  // прямоугольника-«плашки» и без CSS-блендов (не зависит от вёрстки варианта).
  const alphaPass = new ShaderPass(new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uGain: { value: 2.6 }, uKnee: { value: 0.02 }, uShoulder: { value: 0.72 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uGain, uKnee, uShoulder; varying vec2 vUv;
      void main(){ vec4 c = texture2D(tDiffuse, vUv);
        float lum = max(c.r, max(c.g, c.b));
        // Альфа пропорциональна яркости — так свечение только ДОБАВЛЯЕТ свет
        // подложке, а не затемняет её (иначе тусклый ореол и нутро сферы дают
        // тёмные пятна на светлом фоне варианта). Маленький uKnee гасит совсем
        // тёмный шум в ноль, uGain делает сами линии плотными.
        float a = clamp((lum - uKnee) * uGain, 0.0, 1.0);
        // Мягкое сжатие пересвета: складываясь аддитивно, скрещения линий выбивают
        // в чистый белый. Катим по Райнхарду ТОЛЬКО хайлайты выше плеча uShoulder —
        // одиночная линия не меняется, а пересечения саморегулируются, храня цвет.
        vec3 rgb = c.rgb / (1.0 + max(vec3(0.0), c.rgb - uShoulder));
        gl_FragColor = vec4(rgb, a); }`,
    transparent: true, blending: THREE.NoBlending, depthTest: false, depthWrite: false,
  }));
  composer.addPass(alphaPass);
  composer.setSize(VW(), VH());

  const MODES = {
    calm:      { label:'спокойствие', amp:0.048, freq:1.6, speed:0.16, waveAmp:0.042, waveFreq:1.9, twist:0.12, jitter:0.0,  spin:0.075, breathHz:0.28, breathAmp:0.018, colorA:COL_A, colorB:COL_B, edge:COL_E, bloom:num('bloom',0.44) },
    listening: { label:'слушает',     amp:0.05,  freq:2.4, speed:0.5,  waveAmp:0.035, waveFreq:3.0, twist:0.05, jitter:0.0,  spin:0.08,  breathHz:0.0,  breathAmp:0.0,   colorA:COL_A, colorB:COL_B, edge:COL_E, bloom:num('bloom',0.62) },
    thinking:  { label:'думает',      amp:0.05,  freq:1.9, speed:0.34, waveAmp:0.03,  waveFreq:2.3, twist:0.28, jitter:0.0,  spin:0.22,  breathHz:0.65, breathAmp:0.02,  colorA:COL_A, colorB:COL_B, edge:COL_E, bloom:num('bloom',0.58) },
    speaking:  { label:'говорит',     amp:0.10,  freq:2.0, speed:0.95, waveAmp:0.095, waveFreq:2.2, twist:0.06, jitter:0.0,  spin:0.12,  breathHz:0.0,  breathAmp:0.0,   colorA:COL_A, colorB:COL_B, edge:COL_E, bloom:num('bloom',0.72) },
    error:     { label:'ошибка',      amp:0.08,  freq:2.0, speed:0.45, waveAmp:0.04,  waveFreq:2.4, twist:0.04, jitter:0.022, spin:0.06,  breathHz:0.0,  breathAmp:0.0,   colorA:'#c01f4a', colorB:'#ff7a3c', edge:'#ffd0a0', bloom:num('bloom',0.68) },
  };
  function flatten(m) {
    return { amp:m.amp, freq:m.freq, speed:m.speed, waveAmp:m.waveAmp, waveFreq:m.waveFreq,
      twist:m.twist, jitter:m.jitter, bloom:m.bloom,
      colorA:new THREE.Color(m.colorA), colorB:new THREE.Color(m.colorB), edge:new THREE.Color(m.edge) };
  }
  let current = flatten(MODES.calm), target = flatten(MODES.calm), modeMeta = MODES.calm;
  function setMode(name) { const m = MODES[name]; if (!m) return; modeMeta = m; target = flatten(m); }

  // --- фон сцены: прозрачный по умолчанию; #bg=rrggbb делает сплошную заливку --
  function applyBg() {
    if (!BG || BG === 'transparent') { scene.background = null; renderer.setClearColor(0x000000, 0); }
    else { const c = new THREE.Color('#' + BG.replace(/^#/, '')); scene.background = c; renderer.setClearColor(c, 1); }
  }
  applyBg();

  const clock = new THREE.Clock();
  const damp = (a, b, l) => a + (b - a) * l;
  let micLevel = 0, rafId = null, intervalId = null, lastTick = 0, alive = true;
  const perfNow = () => (window.performance && performance.now) ? performance.now() : Date.now();
  function tick() {
    const dt = clock.getDelta(), t = clock.elapsedTime;
    const k = 1 - Math.pow(0.001, dt);
    for (const key of ['amp','freq','speed','waveAmp','waveFreq','twist','jitter','bloom'])
      current[key] = damp(current[key], target[key], k);
    current.colorA.lerp(target.colorA, k); current.colorB.lerp(target.colorB, k); current.edge.lerp(target.edge, k);
    uniforms.uTime.value = t; uniforms.uAmp.value = current.amp; uniforms.uFreq.value = current.freq;
    uniforms.uSpeed.value = current.speed; uniforms.uWaveAmp.value = current.waveAmp;
    uniforms.uWaveFreq.value = current.waveFreq; uniforms.uTwist.value = current.twist;
    uniforms.uJitter.value = current.jitter;
    uniforms.uColorA.value.copy(current.colorA); uniforms.uColorB.value.copy(current.colorB);
    uniforms.uColorEdge.value.copy(current.edge);
    if (micLevel > 0) uniforms.uAmp.value = current.amp + micLevel * 0.05;
    uniforms.uBreath.value = Math.sin(t * modeMeta.breathHz * Math.PI * 2) * modeMeta.breathAmp;
    group.rotation.y += modeMeta.spin * dt;
    camera.getWorldPosition(uniforms.uCamPos.value);
    bloom.strength = current.bloom;
    composer.render();
  }
  function renderFrozenFrame() { camera.getWorldPosition(uniforms.uCamPos.value); composer.render(); }
  function frame() { lastTick = perfNow(); tick(); }
  // Драйвер анимации. RAF даёт плавность, НО во вложенном iframe некоторых вебвью
  // (панель предпросмотра, отдельное окно, приложение) RAF душится до нуля — тогда
  // сфера не рисуется вовсе или пропадает при ресайзе. Дублируем таймером-сторожем:
  // если RAF молчит >100 мс, кадры гонит setInterval (в видимом окне ~30 к/с, в
  // фоне ~1 к/с, но никогда не ноль). Когда RAF работает — сторож простаивает.
  function rafLoop() { if (!alive) return; rafId = requestAnimationFrame(rafLoop); frame(); }
  rafLoop();
  intervalId = setInterval(() => { if (alive && perfNow() - lastTick > 100) frame(); }, 1000 / 30);
  setMode(START_MODE);

  // Заморозку кадра включаем ТОЛЬКО в галерее (home/index.html), где десяток
  // превью-сфер жёг бы GPU. Одиночный вариант — в панели предпросмотра, в
  // отдельном окне или в приложении — держим живым: замороженный кадр иначе
  // пропадает, когда GPU отбирает контекст у простаивающего/фонового canvas.
  function inGallery() {
    try {
      let w = window;
      for (let i = 0; i < 5 && w !== w.top; i++) {
        w = w.parent;
        const p = (w.location && w.location.pathname) || '';
        if (/(^|\/)index\.html$/.test(p) || /\/home\/?$/.test(p)) return true;
      }
    } catch (e) { /* кросс-доменный предок (харнес предпросмотра) — не галерея */ }
    return false;
  }
  if (inGallery()) {
    setTimeout(() => {
      alive = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
      renderFrozenFrame();
    }, 1600);
  }

  // Возврат к жизни: если кадр заморожен (галерея), а контекст восстановился или
  // вкладка снова видима — перерисуем один раз, чтобы сфера не осталась пустой.
  const glCanvas = renderer.domElement;
  glCanvas.addEventListener('webglcontextlost', (e) => e.preventDefault(), false);
  glCanvas.addEventListener('webglcontextrestored', () => { if (!alive) renderFrozenFrame(); }, false);
  const revive = () => { if (!alive) renderFrozenFrame(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) revive(); });
  addEventListener('pageshow', revive);
  addEventListener('focus', revive);

  function resize() {
    const w = VW(), h = VH();
    camera.aspect = w / h; fitCamera(); camera.updateProjectionMatrix();
    renderer.setSize(w, h); composer.setSize(w, h);
    // Если кадр заморожен (галерея), перерисуем один раз в корректном размере;
    // в живом режиме следующий кадр драйвера сам отрисует новый размер.
    if (!alive) renderFrozenFrame();
  }
  addEventListener('resize', resize);
  // Ленивый/масштабированный iframe получает размер после инициализации — ловим это
  // наблюдателем и чиним нулевые рендер-таргеты (incomplete framebuffer).
  if (window.ResizeObserver) { new ResizeObserver(resize).observe(container); }

  // Внешнее управление (для проб из консоли варианта).
  window.setMode = setMode;
  window.setAlpha = (gain, knee) => { alphaPass.material.uniforms.uGain.value = gain; if (knee !== undefined) alphaPass.material.uniforms.uKnee.value = knee; };
  window.setShoulder = (v) => { alphaPass.material.uniforms.uShoulder.value = Math.max(0.05, Number(v) || 0.72); };
  window.setOpacity = (v) => { uniforms.uOpacity.value = v; };
  window.setFill = (v) => { uniforms.uFill.value = Math.max(0, Number(v) || 0); };
  window.setLevel = (v) => { micLevel = Math.max(0, Math.min(1, Number(v) || 0)); };
  window.setBackground = (hex) => { if (!hex) { scene.background = null; renderer.setClearColor(0x000000, 0); } else { const c = new THREE.Color(hex); scene.background = c; renderer.setClearColor(c, 1); } };
  </script>
</body>
</html>
