<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AYRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f;--bg-2:#080a18;--panel:#0a0c1a;--panel-hi:#0f1428;--panel-2:#0c1022;
  --cyan:#00e5ff;--cyan-dim:#0a92ad;--magenta:#ff2fb0;--edge:#d6fbff;--on-accent:#03121a;
  --text:#e2f6ff;--text-2:#9fb6d8;--muted:#5c6b92;
  --line:rgba(0,229,255,.16);--line-soft:rgba(0,229,255,.06);--line-mag:rgba(255,47,176,.30);
  --r-md:10px;--r-lg:16px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--ctl:38px;
  --font:"Inter","Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono","Consolas",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--font);background:#000;color:var(--text);overflow:hidden;}
.app{position:fixed;inset:0;display:grid;grid-template-columns:56fr 44fr;background:var(--bg);}
.grow{flex:1;}

/* ============ ЛЕВАЯ СЦЕНА ============ */
.showcase{position:relative;background:var(--bg);padding:var(--sp-xl);
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  border-right:1px solid var(--line);}
.showcase::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(var(--line-soft) 1px,transparent 1px) 0 0/46px 46px,
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px) 0 0/46px 46px;
  -webkit-mask-image:radial-gradient(125% 95% at 50% 42%,#000 52%,transparent 100%);
  mask-image:radial-gradient(125% 95% at 50% 42%,#000 52%,transparent 100%);}
.showcase::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58% 44% at 50% 40%,rgba(0,229,255,.12),transparent 70%),
    radial-gradient(52% 42% at 62% 68%,rgba(255,47,176,.11),transparent 72%);}
.showcase>*{position:relative;z-index:1;}

.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.brand .word{font-size:30px;font-weight:700;letter-spacing:9px;color:var(--edge);line-height:1;
  text-shadow:0 0 7px rgba(0,229,255,.6),0 0 28px rgba(0,229,255,.4);display:flex;align-items:center;}
.brand .word b{color:var(--magenta);font-weight:700;text-shadow:0 0 12px rgba(255,47,176,.75);}
.brand .cursor{width:11px;height:22px;margin-left:10px;background:var(--cyan);border-radius:2px;
  box-shadow:0 0 12px rgba(0,229,255,.8);animation:blink 1.1s steps(1) infinite;}
.brand .tagline{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;
  letter-spacing:2px;color:var(--text-2);}
.brand .clock{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.55);font-weight:500;}
.brand .clock::before{content:"◈ ";color:var(--magenta);text-shadow:0 0 10px rgba(255,47,176,.7);}
.brand .sep{width:1px;height:12px;background:var(--line);}
.brand .sys{color:var(--muted);}
.brand .sys em{font-style:normal;color:var(--magenta);text-shadow:0 0 8px rgba(255,47,176,.6);}

.stage{position:relative;margin:0 calc(var(--sp-xl)*-1);}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

.sc-foot{display:flex;align-items:center;gap:var(--sp-md);}
.sc-foot .cap{flex:1;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:6px;
  color:var(--muted);text-transform:uppercase;}
.ghost{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(0,229,255,.04);color:var(--cyan);font-size:18px;border-radius:var(--r-md);cursor:pointer;
  transition:.18s;}
.ghost:hover{background:rgba(0,229,255,.12);box-shadow:0 0 16px rgba(0,229,255,.4);color:var(--edge);}
.foot-spacer{width:var(--ctl);height:var(--ctl);}
/* ============ ПРАВЫЙ ДИАЛОГ ============ */
.dialog{position:relative;background:var(--panel);padding:var(--sp-xl);
  display:grid;grid-template-rows:auto 1fr auto;gap:var(--sp-lg);min-width:0;overflow:hidden;
  border-left:1px solid var(--line-mag);
  box-shadow:inset 22px 0 60px -40px rgba(255,47,176,.5),inset -22px 0 60px -40px rgba(0,229,255,.4);}
.dialog::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:3;
  background:linear-gradient(90deg,transparent,var(--magenta),var(--cyan),transparent);
  box-shadow:0 0 14px rgba(0,229,255,.5);}
.dialog::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    linear-gradient(var(--line-soft) 1px,transparent 1px) 0 0/46px 46px,
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px) 0 0/46px 46px;
  -webkit-mask-image:radial-gradient(140% 100% at 100% 0%,#000 30%,transparent 80%);
  mask-image:radial-gradient(140% 100% at 100% 0%,#000 30%,transparent 80%);}
.dialog>*{position:relative;z-index:1;}

.bar{display:flex;align-items:flex-start;gap:var(--sp-sm);}
.tb{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:1px solid transparent;
  background:transparent;color:var(--text-2);font-size:22px;border-radius:var(--r-md);cursor:pointer;transition:.18s;}
.tb:hover{color:var(--cyan);border-color:var(--line);background:rgba(0,229,255,.06);box-shadow:0 0 14px rgba(0,229,255,.3);}
.tb.close:hover{color:var(--magenta);border-color:var(--line-mag);background:rgba(255,47,176,.08);box-shadow:0 0 14px rgba(255,47,176,.4);}
.prof{display:flex;flex-direction:column;align-items:center;gap:3px;}
.profile{background:transparent;border:0;color:var(--text);font-weight:600;font-size:14px;letter-spacing:.4px;cursor:pointer;}
.profile:hover{color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.5);}
.offline{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);}
.offline b{color:var(--magenta);font-weight:700;text-shadow:0 0 8px rgba(255,47,176,.7);}
.stats{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;
  color:var(--muted);align-self:center;white-space:nowrap;letter-spacing:.5px;}
.stats b{color:var(--cyan);font-weight:600;text-shadow:0 0 8px rgba(0,229,255,.4);}
.modes{justify-self:center;display:inline-flex;gap:8px;}
.pill{flex:0 0 auto;padding:8px 18px;border:1px solid transparent;background:transparent;color:var(--text-2);
  border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:.18s;}
.pill:hover{color:var(--edge);border-color:var(--line);box-shadow:0 0 12px rgba(0,229,255,.25) inset;}
.pill.active{color:var(--edge);text-shadow:0 0 10px rgba(0,229,255,.55),0 0 18px rgba(255,47,176,.35);}

.body{display:grid;place-items:center;}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;}
.avatar{width:60px;height:60px;filter:drop-shadow(0 0 14px rgba(0,229,255,.55));}
.status{font-size:30px;font-weight:700;letter-spacing:.5px;text-align:center;
  background:linear-gradient(96deg,var(--edge),var(--cyan) 45%,var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(0,229,255,.35));}
.sub{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--muted);}
.sub em{font-style:normal;color:var(--cyan);}

.input{position:relative;background:var(--panel-hi);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:8px 10px 12px;display:grid;gap:2px;transition:.18s;
  box-shadow:0 0 0 rgba(0,229,255,0);}
.input:focus-within{border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(0,229,255,.4),0 0 26px -4px rgba(0,229,255,.45);}
.field{background:transparent;border:0;outline:0;color:var(--text);font-size:15px;font-family:var(--font);padding:6px;}
.field::placeholder{color:var(--muted);}
.ctrls{display:flex;align-items:center;gap:6px;}
.ig{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:1px solid transparent;
  background:transparent;color:var(--text-2);border-radius:var(--r-md);cursor:pointer;transition:.18s;}
.ig:hover{color:var(--cyan);border-color:var(--line);background:rgba(0,229,255,.06);box-shadow:0 0 12px rgba(0,229,255,.3);}
.ig.code{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--magenta);}
.ig.code:hover{color:var(--magenta);border-color:var(--line-mag);box-shadow:0 0 12px rgba(255,47,176,.35);}
.send{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border:0;cursor:pointer;
  background:linear-gradient(120deg,var(--cyan),var(--magenta));color:var(--on-accent);border-radius:var(--r-md);
  box-shadow:0 0 18px rgba(0,229,255,.45);transition:.18s;}
.send:hover{filter:brightness(1.12);box-shadow:0 0 24px rgba(0,229,255,.6),0 0 20px rgba(255,47,176,.4);transform:translateY(-1px);}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}

@keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:44fr 56fr;}
  .showcase{border-right:0;border-bottom:1px solid var(--line);}.dialog{border-left:0;}}
</style></head><body>
<div class="app">
  <section class="showcase">
    <div class="brand">
      <div class="word">AY<b>R</b>IS<span class="cursor"></span></div>
      <div class="tagline">
        <span class="clock" id="clock">00:00</span>
        <span class="sep"></span>
        <span class="sys">NEURAL LINK <em>ONLINE</em></span>
      </div>
    </div>
    <div class="stage">
      <iframe src="_sphere.html#a=ff2fb0&amp;b=00e5ff&amp;e=d6fbff&amp;bg=transparent&amp;mode=calm" title="Сфера"></iframe>
    </div>
    <div class="sc-foot">
      <button class="ghost" title="Во весь экран">⤢</button>
      <div class="cap">Ayris&nbsp;·&nbsp;Assistant</div>
      <div class="foot-spacer"></div>
    </div>
  </section>

  <section class="dialog">
    <div class="bar">
      <button class="tb" title="Настройки">≡</button>
      <span class="grow"></span>
      <div class="prof">
        <button class="profile">По умолчанию&nbsp;▾</button>
        <span class="offline"><b>●</b> ОФЛАЙН</span>
      </div>
      <span class="grow"></span>
      <button class="tb" title="Свернуть">–</button>
      <button class="tb close" title="Закрыть">✕</button>
    </div>

    <div class="body"><div class="empty">
      <svg class="avatar" viewBox="0 0 100 100"><defs>
        <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#ff2fb0" stop-opacity="0.30"/></linearGradient>
        <linearGradient id="triS" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2fb0"/></linearGradient></defs>
        <path d="M50 18 L82 74 L18 74 Z" fill="url(#tri)" stroke="url(#triS)" stroke-width="5" stroke-linejoin="round"/></svg>
      <div class="status">Привет, чем помочь?</div>
      <div class="sub">// <em>готов к вводу команды</em></div>
    </div></div>

    <div class="input">
      <input class="field" type="text" placeholder="Введите команду или скажите «Айрис»…">
      <div class="ctrls">
        <button class="ig code" title="Режим кода">&lt;/&gt;</button>
        <span class="grow"></span>
        <button class="ig" title="Микрофон"><svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg></button>
        <button class="send" title="Отправить"><svg class="icon" viewBox="0 0 24 24" style="stroke:var(--on-accent)"><path d="M12 20V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </div>
  </section>
</div>
<script>
  const pad=n=>String(n).padStart(2,'0');
  function tick(){const d=new Date();document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
  tick();setInterval(tick,1000);
  const frame=document.querySelector('.stage iframe');
  // dev: SimpleHTTP не шлёт ETag/Cache-Control → iframe берёт _sphere.html из
  // кэша и правки не видны; перезагружаем со свежим ?v, сохранив #hash.
  { const _h = frame.src.split('#')[1] || ''; frame.src = '_sphere.html?v=' + Date.now() + '#' + _h; }
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    try{frame.contentWindow.setMode(btn.dataset.mode);}catch(e){}
  }));
</script>
</body></html>
