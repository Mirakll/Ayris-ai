# Хуки git — два, и оба зовут один и тот же `scripts/check.sh`.
#
#   pre-commit  →  scripts/check.sh --lint   (~7 с)
#   pre-push    →  scripts/check.sh          (~65 с, с тестами и железом)
#
# **Ставит их `bash scripts/install_hooks.sh`, а не `pre-commit install`.** На
# машине с кириллицей в пути генератор из пакета pre-commit вписывает в хук
# абсолютный путь к питону в кодировке консоли, и хук ломается насмерть: «`pre-
# commit` not found» на каждый коммит. Подробности — в комментарии install_hooks.
#
# Этот файл остаётся источником истины про то, что в каком хуке идёт, работает
# для `pre-commit run --all-files` и для машин с латинским путём, где
# `pre-commit install --hook-type pre-commit --hook-type pre-push` тоже годится.
#
# Раньше здесь было четыре чужих репозитория с закреплёнными версиями ruff,
# black и mypy плюс пять питоньих пинов в `additional_dependencies`. То есть
# второй список версий рядом с pyproject.toml — и ничем не проверяемый: подняв
# ruff в проекте, легко забыть про эту копию, и тогда хук и CI начинают судить
# по разным правилам. Хуже того, `mixed-line-ending --fix=lf` переписывал
# `*.ps1`, `*.bat`, `*.cmd`, `*.iss` и `*.reg`, которым `.gitattributes`
# намеренно велит лежать в рабочей копии с CRLF.
#
# Теперь хук вызывает `scripts/check.sh --lint`: ruff, black, mypy, сверку
# установленных версий с пинами и запуск `python -m ayris --version` — тем же
# скриптом и тем же питоном проекта, каким это делается вручную. ~6 с.
#
# Гигиена (UTF-8, маркеры конфликта, размер файлов, перевод строки в конце,
# LF в индексе, разбор toml и json) в хук не входит: она переехала в
# tests/unit/test_hygiene.py, идёт в каждом джобе и в каждом прогоне тестов и
# падает с объяснением, а не с молчаливой правкой файла под руками.

repos:
  - repo: local
    hooks:
      - id: ayris-lint
        name: ruff + black + mypy + пины + запуск
        entry: bash scripts/check.sh --lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # Тексты и картинки эти проверки не трогают, а шесть секунд стоят.
        files: \.(py|pyi|toml|cfg|txt)$

      # Перед пушем — весь набор, тот же самый скрипт без ключей: линтеры,
      # тесты в несколько процессов, `slow` и `hardware` отдельными
      # последовательными стадиями, сверка пинов, запуск, поиск секретов. ~65 с.
      #
      # Зачем гейт, а не инструкция в CLAUDE.md: пуш — это момент, когда работа
      # уходит с машины, и дальше её судит CI четыре с половиной минуты. Дешевле
      # узнать про красное здесь. Главное же — `hardware` (микрофон, экран,
      # Диспетчер учётных данных) в CI не идёт вообще: у раннеров нет звуковой
      # карты, и этот прогон — единственное место, где живое железо проверяется.
      # Пока набор был инструкцией, его можно было забыть или подменить точечным
      # `pytest` по одному файлу; хук такого выбора не оставляет.
      - id: ayris-full
        name: полный прогон (тесты, slow, hardware, секреты)
        entry: bash scripts/check.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
